# Dependabot Configuration
# =========================
# Simplified dependency management focusing on core packages
# Documentation: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # GitHub Actions - Keep CI/CD workflows up-to-date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # NodeGoat - Node.js application
  - package-ecosystem: "npm"
    directory: "/NodeGoat"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(nodegoat)"
    ignore:
      # Avoid major version updates that might break demos
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # WebGoat - Java/Maven application
  - package-ecosystem: "maven"
    directory: "/WebGoat"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "deps(webgoat)"
    ignore:
      # Avoid major version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker images
  - package-ecosystem: "docker"
    directory: "/NodeGoat"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker(nodegoat)"

  - package-ecosystem: "docker"
    directory: "/WebGoat"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker(webgoat)"
