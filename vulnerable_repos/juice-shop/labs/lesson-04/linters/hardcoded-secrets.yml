rules:
  - id: hardcoded-api-key
    patterns:
      - pattern-either:
          # API key assignments
          - pattern: |
              $VAR = "$KEY"
          - pattern: |
              const $VAR = '$KEY'
          - pattern: |
              let $VAR = "$KEY"
          - pattern: |
              var $VAR = '$KEY'
      - metavariable-regex:
          metavariable: $VAR
          regex: '(?i).*(api[_-]?key|apikey|access[_-]?key|secret[_-]?key|auth[_-]?key).*'
      - metavariable-regex:
          metavariable: $KEY
          regex: '^[A-Za-z0-9+/=_-]{20,}$'
    message: |
      Possible hardcoded API key detected (CWE-798).

      RISK: API keys hardcoded in source code can be easily extracted and misused.

      SECURE ALTERNATIVE:
      ```javascript
      // Load from environment variables
      const apiKey = process.env.API_KEY;

      // Or use a secret management service
      const { SecretClient } = require("@azure/keyvault-secrets");
      const { DefaultAzureCredential } = require("@azure/identity");

      const credential = new DefaultAzureCredential();
      const client = new SecretClient(vaultUrl, credential);
      const secret = await client.getSecret("api-key");
      const apiKey = secret.value;
      ```
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      cwe: CWE-798
      owasp: A07:2021 - Identification and Authentication Failures
      category: security

  - id: hardcoded-jwt-secret
    patterns:
      - pattern-either:
          - pattern: jwt.sign(..., "$SECRET", ...)
          - pattern: jwt.verify(..., '$SECRET', ...)
          - pattern: |
              $VAR = "$SECRET"
              ...
              jwt.sign(..., $VAR, ...)
          - pattern: |
              $VAR = '$SECRET'
              ...
              jwt.verify(..., $VAR, ...)
      - metavariable-regex:
          metavariable: $SECRET
          regex: '^[A-Za-z0-9!@#$%^&*()_+\-=]{8,}$'
    message: |
      Hardcoded JWT secret detected (CWE-798).

      CRITICAL RISK:
      JWT secrets hardcoded in source code allow anyone with repository access to:
      - Forge valid authentication tokens
      - Impersonate any user
      - Bypass authorization controls

      SECURE ALTERNATIVE:
      ```javascript
      // Use environment variable
      const jwtSecret = process.env.JWT_SECRET;

      if (!jwtSecret) {
        throw new Error('JWT_SECRET environment variable not set');
      }

      const token = jwt.sign(payload, jwtSecret, {
        algorithm: 'HS256',
        expiresIn: '1h'
      });
      ```

      DEPLOYMENT:
      - Development: Use .env file (not committed to git)
      - Production: Use Azure Key Vault, AWS Secrets Manager, or similar

      ADDITIONAL SECURITY:
      - Use strong, randomly generated secrets (32+ characters)
      - Rotate secrets regularly
      - Use RS256 (asymmetric) instead of HS256 for better key management
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      cwe: CWE-798
      owasp: A07:2021 - Identification and Authentication Failures
      category: security
      references:
        - https://tools.ietf.org/html/rfc8725

  - id: hardcoded-database-password
    patterns:
      - pattern-either:
          # MongoDB connection strings
          - pattern: |
              "$CONN"
          - pattern: |
              '$CONN'
      - metavariable-regex:
          metavariable: $CONN
          regex: '.*mongodb(\+srv)?://[^:]+:[^@]+@.*'
    message: |
      Hardcoded database password in connection string (CWE-798).

      RISK:
      Database credentials in connection strings expose your entire database to anyone
      with access to the source code or compiled application.

      SECURE ALTERNATIVE:
      ```javascript
      // Use environment variables
      const mongoUri = process.env.MONGODB_URI;

      // Or build from separate components
      const username = process.env.DB_USER;
      const password = process.env.DB_PASSWORD;
      const host = process.env.DB_HOST;
      const uri = `mongodb://${username}:${password}@${host}`;

      // Better: Use managed identity (Azure Cosmos DB)
      const { DefaultAzureCredential } = require("@azure/identity");
      const credential = new DefaultAzureCredential();
      // No password needed!
      ```
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      cwe: CWE-798
      owasp: A07:2021 - Identification and Authentication Failures
      category: security

  - id: hardcoded-aws-credentials
    patterns:
      - pattern-either:
          - pattern: |
              $VAR = "$KEY"
          - pattern: |
              $VAR = '$KEY'
      - metavariable-regex:
          metavariable: $VAR
          regex: '(?i).*(aws[_-]?access[_-]?key|aws[_-]?secret|access[_-]?key[_-]?id).*'
      - metavariable-regex:
          metavariable: $KEY
          regex: '^(AKIA[0-9A-Z]{16}|[A-Za-z0-9/+=]{40})$'
    message: |
      Hardcoded AWS credentials detected (CWE-798).

      CRITICAL RISK:
      Hardcoded AWS access keys can lead to:
      - Unauthorized access to AWS resources
      - Data breaches
      - Resource manipulation
      - Massive unexpected bills

      SECURE ALTERNATIVE:
      ```javascript
      // AWS SDK automatically uses:
      // 1. IAM roles (EC2, ECS, Lambda)
      // 2. Environment variables
      // 3. ~/.aws/credentials file

      const AWS = require('aws-sdk');
      const s3 = new AWS.S3();
      // No credentials needed if running in AWS with IAM role!
      ```

      BEST PRACTICE:
      - Use IAM roles for AWS resources
      - Use AWS Secrets Manager for external credentials
      - Never commit credentials to git
      - Rotate keys regularly
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      cwe: CWE-798
      owasp: A07:2021 - Identification and Authentication Failures
      category: security
      references:
        - https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html

  - id: generic-high-entropy-secret
    patterns:
      - pattern-either:
          - pattern: |
              $VAR = "$SECRET"
          - pattern: |
              $VAR = '$SECRET'
      - metavariable-regex:
          metavariable: $VAR
          regex: '(?i).*(secret|password|passwd|pwd|token|key|credential|auth).*'
      - metavariable-regex:
          metavariable: $SECRET
          regex: '^[A-Za-z0-9+/=_-]{32,}$'
    message: |
      Possible hardcoded secret detected (high entropy string) (CWE-798).

      This appears to be a secret/password/token hardcoded in the source code.

      RECOMMENDATION:
      - Use environment variables: process.env.SECRET_NAME
      - Use a secret management service (Azure Key Vault, HashiCorp Vault)
      - Never commit secrets to version control

      If this is a false positive (e.g., a test fixture or example):
      - Add a comment explaining why it's safe: // nosemgrep: generic-high-entropy-secret
      - Or move to a test fixtures directory
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      cwe: CWE-798
      category: security
